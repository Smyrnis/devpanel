name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:

jobs:
  checks:
    name: Rust and script checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Use stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check build
        run: cargo check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check installer shell syntax
        run: |
          bash -n scripts/postinst
          bash -n scripts/devpanel-setup.sh
          bash -n installation/devpanel-setup.sh
          bash -n installation/devpanel-create-projects-dir.sh
          for file in installation/lib/*.sh installation/dependencies/*.sh; do
            bash -n "$file"
          done

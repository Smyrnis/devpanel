[package]
name = "devpanel"
version = "0.26.37"
edition = "2024"
description = "Local development environment manager for Debian/Ubuntu"
authors = ["Giannis Smyrnis <smyrnisgiannis@gmail.com>"]


[[bin]]
name = "devpanel"
path = "src/main.rs"


[lib]
name = "devpanel"
path = "src/lib.rs"

#   cargo build                       → dev / dry-run (default)
#   cargo build --features production → real sudo / apt / systemctl
#   cargo deb                         → always passes --features production

[features]
default    = []
production = []

[dependencies]
iced              = { version = "0.13", features = ["tokio", "image"] }
iced_font_awesome = "0.2"
tokio             = { version = "1",    features = ["full"] }
rfd               = "0.15"
image             = "0.25"
rusqlite          = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1.2"
thiserror         = "2"
notify            = "6"
serde_json        = "1"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "Giannis Smyrnis <smyrnisgiannis@gmail.com>"
copyright = "2026 Giannis Smyrnis"
license-file = ["LICENSE"]
extended-description = """
DevPanel is a desktop GUI for managing your local development environment.
Control Apache, MySQL and PHP services, create Apache VirtualHosts,
and manage SSH keys — all from a single polished interface.
"""
depends = "$auto, acl"
section = "devel"
priority = "optional"
assets = [
  ["target/release/devpanel",          "usr/bin/",                        "755"],
  ["share/icon/devpanel.png",          "usr/share/pixmaps/devpanel.png",  "644"],
  ["devpanel.desktop",                 "usr/share/applications/",         "644"],
  ["share/index.php",                  "usr/share/devpanel/",             "644"],
  ["share/ui/config.json",             "usr/share/devpanel/ui/",          "644"],
  ["share/versions/php.json",          "usr/share/devpanel/versions/",    "644"],
  ["share/versions/composer.json",     "usr/share/devpanel/versions/",    "644"],
  ["share/versions/node.json",         "usr/share/devpanel/versions/",    "644"],
  ["share/languages/en.json",          "usr/share/devpanel/languages/",   "644"],
  ["share/themes/default.json",           "usr/share/devpanel/themes/",      "644"],
  ["scripts/devpanel-setup.sh",        "usr/share/devpanel/",             "755"],
  ["installation/devpanel-setup.sh",   "usr/share/devpanel/installation/","755"],
  ["installation/devpanel-create-projects-dir.sh", "usr/share/devpanel/installation/","755"],
  ["installation/lib/log.sh",          "usr/share/devpanel/installation/lib/","755"],
  ["installation/lib/paths.sh",        "usr/share/devpanel/installation/lib/","755"],
  ["installation/lib/context.sh",      "usr/share/devpanel/installation/lib/","755"],
  ["installation/lib/runner.sh",       "usr/share/devpanel/installation/lib/","755"],
  ["installation/dependencies/common.sh",         "usr/share/devpanel/installation/dependencies/","755"],
  ["installation/dependencies/install_apache.sh", "usr/share/devpanel/installation/dependencies/","755"],
  ["installation/dependencies/install_php.sh",    "usr/share/devpanel/installation/dependencies/","755"],
  ["installation/dependencies/install_composer.sh", "usr/share/devpanel/installation/dependencies/","755"],
  ["installation/dependencies/install_node.sh",   "usr/share/devpanel/installation/dependencies/","755"],
  ["installation/dependencies/install_mysql.sh",  "usr/share/devpanel/installation/dependencies/","755"],
  ["installation/dependencies/setup_vhost.sh",    "usr/share/devpanel/installation/dependencies/","755"],
  ["installation/dependencies/install_tools.sh",  "usr/share/devpanel/installation/dependencies/","755"],
]
features = ["production"]
maintainer-scripts = "scripts/"
revision = ""
